<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Action</title>
</head>
<body>
    <h1>Form Submission Result</h1>

    <p><strong>First Name:</strong><span id = "display-fname"></span></p>
    <p><strong>Middle Name:</strong><span id = "display-mname"></span></p>
    <p><strong>Last Name:</strong><span id = "display-lname"></span></p>

    <script>
        const urlParams = new URLSearchParams(window.location.search)

        const firstName = urlParams.get('fname');
        const middleName = urlParams.get('mname');
        const lastName = urlParams.get('lname');

        document.getElementById('display-fname').textContent = firstName || 'N/A';
        document.getElementById('display-mname').textContent = middleName || 'N/A';
        document.getElementById('display-lname').textContent = lastName || 'N/A';
    </script>
</body>
</html>
